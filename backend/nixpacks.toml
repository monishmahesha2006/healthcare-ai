# Railway Nixpacks configuration for the FastAPI backend
# Docs: https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["python312", "gcc", "libpq"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
# Railway injects $PORT — uvicorn reads it here
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
